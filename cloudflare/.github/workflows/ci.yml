name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install
        working-directory: cloudflare
        run: npm ci
      - name: Generate Worker types
        working-directory: cloudflare
        run: npx wrangler types
      - name: Typecheck
        working-directory: cloudflare
        run: npm run typecheck
      - name: Lint
        working-directory: cloudflare
        run: npm run lint
      - name: Test
        working-directory: cloudflare
        run: npm test
      - name: Build
        working-directory: cloudflare
        run: npm run build
